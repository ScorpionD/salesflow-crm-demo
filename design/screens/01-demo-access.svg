<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><title>01-demo-access</title><rect x="0" y="0" width="1440" height="1050" rx="0" fill="#F7F8FA" stroke="none"/><rect x="72" y="60" width="36" height="36" rx="8" fill="#4F46E5" stroke="none"/><text x="83" y="85" font-family="Inter, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="700">S</text><text x="120" y="86" font-family="Inter, Arial, sans-serif" font-size="24" fill="#172033" font-weight="700">SalesFlow</text><rect x="1110" y="64" width="132" height="24" rx="6" fill="#EEF2FF" stroke="none"/><text x="1120" y="80" font-family="Inter, Arial, sans-serif" font-size="11" fill="#4F46E5" font-weight="600">WORKING CRM DEMO</text><text x="110" y="198" font-family="Inter, Arial, sans-serif" font-size="44" fill="#172033" font-weight="700">Better sales conversations.</text><text x="110" y="250" font-family="Inter, Arial, sans-serif" font-size="44" fill="#4F46E5" font-weight="700">A clearer path to won.</text><text x="110" y="290" font-family="Inter, Arial, sans-serif" font-size="18" fill="#64748B" font-weight="400">Contacts, deals and next actions — connected in one focused workspace.</text><text x="110" y="322" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748B" font-weight="400">Choose a role. Explore a private, fictional sales dataset. No sign-up needed.</text><rect x="110" y="380" width="390" height="268" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="134" y="405" width="118" height="24" rx="6" fill="#EEF2FF" stroke="none"/><text x="144" y="421" font-family="Inter, Arial, sans-serif" font-size="11" fill="#4F46E5" font-weight="600">FULL WORKSPACE</text><text x="134" y="476" font-family="Inter, Arial, sans-serif" font-size="23" fill="#172033" font-weight="600">Sales Manager</text><text x="134" y="515" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748B" font-weight="400">Manage deals, assignments and reports.</text><text x="134" y="541" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" font-weight="400">Review the team and Won automation.</text><g id="Button-Enter as Manager"><rect x="134" y="574" width="342" height="40" rx="8" fill="#4F46E5" stroke="none"/><text x="150" y="599" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Enter as Manager</text></g><rect x="524" y="380" width="390" height="268" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="548" y="405" width="146" height="24" rx="6" fill="#EEF2FF" stroke="none"/><text x="558" y="421" font-family="Inter, Arial, sans-serif" font-size="11" fill="#4F46E5" font-weight="600">YOUR OPPORTUNITIES</text><text x="548" y="476" font-family="Inter, Arial, sans-serif" font-size="23" fill="#172033" font-weight="600">Sales Representative</text><text x="548" y="515" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748B" font-weight="400">Work your deals, tasks and follow-ups.</text><text x="548" y="541" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" font-weight="400">Update stages and add useful notes.</text><g id="Button-Enter as Representative"><rect x="548" y="574" width="342" height="40" rx="8" fill="#4F46E5" stroke="none"/><text x="564" y="599" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Enter as Representative</text></g><rect x="938" y="380" width="390" height="268" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="962" y="405" width="83" height="24" rx="6" fill="#EEF2FF" stroke="none"/><text x="972" y="421" font-family="Inter, Arial, sans-serif" font-size="11" fill="#4F46E5" font-weight="600">READ ONLY</text><text x="962" y="476" font-family="Inter, Arial, sans-serif" font-size="23" fill="#172033" font-weight="600">Viewer</text><text x="962" y="515" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748B" font-weight="400">Explore pipeline and team activity.</text><text x="962" y="541" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" font-weight="400">All changes are blocked on the server.</text><g id="Button-Enter as Viewer"><rect x="962" y="574" width="342" height="40" rx="8" fill="#4F46E5" stroke="none"/><text x="978" y="599" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Enter as Viewer</text></g><text x="110" y="705" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" font-weight="400">Private demo workspace · 24-hour retention · Synthetic data only</text><text x="110" y="780" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033" font-weight="600">What this demo solves</text><text x="110" y="804" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="400">Contact management · Sales pipeline · Tasks · Team visibility · Reports · Automation</text><text x="110" y="863" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033" font-weight="600">Designed and built end to end</text><text x="110" y="887" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="400">Business process → UX → Figma → Design system → React → API → PostgreSQL → Deployment</text><text x="110" y="950" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" font-weight="400">Production-style demo. Future CRM/channel integrations are customization options.</text></svg>