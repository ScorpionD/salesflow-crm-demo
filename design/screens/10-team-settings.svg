erif" font-size="15" fill="#172033" font-weight="400">Data expires after 24 hours.</text><text x="864" y="635" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748B" font-weight="400">Other visitors receive separate workspaces.</text><rect x="864" y="669" width="146" height="24" rx="6" fill="#ECFDF5" stroke="none"/><text x="874" y="685" font-family="Inter, Arial, sans-serif" font-size="11" fill="#059669" font-weight="600">SSE · Live updates</text><g id="Button-Switch demo role"><rect x="864" y="719" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><text x="880" y="744" font-family="Inter, Arial, sans-serif" font-size="13" fill="#172033" font-weight="600">Switch demo role</text></g><rect x="256" y="818" width="1152" height="155" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="280" y="857" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033" font-weight="600">Built for customization</text><text x="280" y="881" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="400">Sales teams · B2B services · Agencies · Account management · Customer success</text><text x="280" y="922" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="400">Future options: HubSpot, Salesforce, Gmail, Outlook, Slack, WhatsApp, calendars, Stripe and custom APIs.</text></svg>