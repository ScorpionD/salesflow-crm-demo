<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><title>11-stage-confirmation</title><rect x="0" y="0" width="1440" height="1050" rx="0" fill="#E7EAF0" stroke="none"/><rect x="470" y="285" width="500" height="425" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="502" y="336" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033" font-weight="600">Move deal to Won?</text><text x="502" y="360" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="400">Alder CRM rollout · $12,000</text><text x="502" y="419" font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748B" font-weight="400">This records the win and queues a manager notification.</text><text x="502" y="458" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="500">Stage</text><rect x="502" y="470" width="436" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><text x="514" y="497" font-family="Inter, Arial, sans-serif" font-size="14" fill="#172033" font-weight="400">Won</text><text x="502" y="561" font-family="Inter, Arial, sans-serif" font-size="12" fill="#64748B" font-weight="400">A timeline event is saved in the same transaction.</text><g id="Button-Cancel"><rect x="502" y="606" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/><text x="518" y="631" font-family="Inter, Arial, sans-serif" font-size="13" fill="#172033" font-weight="600">Cancel</text></g><g id="Button-Confirm Won"><rect x="658" y="606" width="280" height="40" rx="8" fill="#4F46E5" stroke="none"/><text x="674" y="631" font-family="Inter, Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Confirm Won</text></g></svg>